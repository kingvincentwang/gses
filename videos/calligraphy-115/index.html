<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Iansui";
        src: url("assets/iansui-subset.ttf") format("truetype");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #fffaf0;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Iansui", serif;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      #camera {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        transform-origin: 0 0;
      }
      #poster {
        display: block;
        width: 1920px;
        height: 1080px;
        object-fit: cover;
      }
      #flash {
        background: #ffffff;
      }
      #dim {
        background: rgba(20, 30, 60, 1);
        opacity: 0;
      }
      .card-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        padding: 64px 110px;
        background: #fffaf0;
        border: 8px solid #d62839;
        border-radius: 40px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        opacity: 0;
      }
      .card .big {
        color: #d62839;
        font-size: 150px;
        line-height: 1.1;
        letter-spacing: 0.06em;
      }
      .card .small {
        color: #1b3a8a;
        font-size: 64px;
        line-height: 1.2;
        letter-spacing: 0.08em;
      }
      .card .names {
        color: #d62839;
        font-size: 104px;
        line-height: 1.2;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40.5"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene" class="layer clip" data-start="0" data-duration="40.5" data-track-index="0">
        <div id="camera">
          <img id="poster" src="assets/poster.webp" alt="115學年度校內硬筆書法比賽得獎名單" />
        </div>
        <div id="flash" class="layer"></div>
      </div>

      <div id="overlay" class="layer clip" data-start="27.2" data-duration="13.3" data-track-index="1">
        <div id="dim" class="layer"></div>
        <div class="layer card-wrap">
          <div id="congrats" class="card">
            <div class="big">恭喜得獎同學！</div>
            <div class="small">關西國小全體師生同賀</div>
          </div>
        </div>
        <div class="layer card-wrap">
          <div id="thanks" class="card">
            <div class="small">感謝</div>
            <div class="names">校長、玉君老師、德如老師</div>
            <div class="small">的協助與指導，讓比賽順利完成</div>
          </div>
        </div>
      </div>
      <audio id="bgm" src="audio/bgm.mp3" data-start="0" data-duration="40.5" data-track-index="2" data-volume="0.14"></audio>
      <audio id="g1" src="audio/g1.mp3" data-start="0.5" data-duration="5.8" data-track-index="3" data-volume="1"></audio>
      <audio id="g2" src="audio/g2.mp3" data-start="8.1" data-duration="8.36" data-track-index="3" data-volume="1"></audio>
      <audio id="g3" src="audio/g3.mp3" data-start="18.2" data-duration="8.39" data-track-index="3" data-volume="1"></audio>
      <audio id="g4" src="audio/g4.mp3" data-start="29.3" data-duration="1.72" data-track-index="3" data-volume="1"></audio>
      <audio id="g5" src="audio/g5.mp3" data-start="32.7" data-duration="5.8" data-track-index="3" data-volume="1"></audio>
    </div>
    <script>
      // Camera framing on the 1920x1080 poster: centre (cx, cy) at zoom s, clamped so the
      // poster always covers the frame.
      function shot(cx, cy, s) {
        const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
        return {
          x: clamp(960 - cx * s, 1920 - 1920 * s, 0),
          y: clamp(540 - cy * s, 1080 - 1080 * s, 0),
          scale: s,
        };
      }
      const TITLE = [937, 160];
      const MID = [615, 595];
      const HIGH = [1281, 595];

      const tl = gsap.timeline({ paused: true });

      // 0–7s: title (narration g1), gentle pull-back while fading in from white
      tl.set("#camera", shot(...TITLE, 1.75), 0);
      tl.to("#flash", { opacity: 0, duration: 0.7, ease: "power1.out" }, 0);
      tl.to("#camera", { ...shot(...TITLE, 1.6), duration: 7, ease: "sine.out" }, 0);

      // 7–17.1s: move to 中年級組 and push in (narration g2)
      tl.addLabel("mid", 7);
      tl.to("#camera", { ...shot(...MID, 1.75), duration: 1.3, ease: "power2.inOut" }, "mid");
      tl.to("#camera", { ...shot(...MID, 1.82), duration: 8.8, ease: "sine.inOut" }, "mid+=1.3");

      // 17.1–27.2s: move to 高年級組 and push in (narration g3)
      tl.addLabel("high", 17.1);
      tl.to("#camera", { ...shot(...HIGH, 1.75), duration: 1.3, ease: "power2.inOut" }, "high");
      tl.to("#camera", { ...shot(...HIGH, 1.82), duration: 8.8, ease: "sine.inOut" }, "high+=1.3");

      // 27.2–28.7s: pull back to the full poster
      tl.addLabel("full", 27.2);
      tl.to("#camera", { ...shot(960, 540, 1), duration: 1.5, ease: "power2.inOut" }, "full");

      // 28.8–32.3s: congratulations card (narration g4)
      tl.to("#dim", { opacity: 0.45, duration: 0.6, ease: "power1.out" }, 28.8);
      tl.fromTo(
        "#congrats",
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.6)" },
        29,
      );
      tl.to("#congrats", { opacity: 0, scale: 0.95, duration: 0.5, ease: "power1.in" }, 31.8);

      // 32.4–40.5s: thanks card (narration g5), held to the end
      tl.fromTo(
        "#thanks",
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.6)", immediateRender: false },
        32.4,
      );

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
