<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>望梅止渴動畫</title>
<style>
@font-face { font-family: 'Iansui'; src: url('assets/iansui-subset.woff2') format('woff2'); font-display: block; }
:root {
  --bg: #f3ece0; --ink: #1f2a44; --muted: #6b6253; --accent: #b3312c; --panel: #fffaf2; --line: #d9ccb6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #16181d; --ink: #ece4d6; --muted: #a59c8c; --accent: #e0645c; --panel: #20232a; --line: #3a3d45; }
}
:root[data-theme="dark"] { --bg: #16181d; --ink: #ece4d6; --muted: #a59c8c; --accent: #e0645c; --panel: #20232a; --line: #3a3d45; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Iansui', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
h1 { font-size: 30px; margin: 4px 0 4px; letter-spacing: .1em; }
.sub { color: var(--muted); margin: 0 0 14px; font-size: 15px; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
canvas { width: 100%; height: 100%; display: block; }
.start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: rgba(20,22,30,.55); color: #fff7e6; cursor: pointer; border: 0; font: inherit; width: 100%; }
.start .big { width: 84px; height: 84px; border-radius: 50%; background: #b3312c; display: grid; place-items: center; box-shadow: 0 0 0 8px rgba(255,255,255,.15); }
.start .big::after { content: ''; border-left: 28px solid #fff; border-top: 17px solid transparent; border-bottom: 17px solid transparent; margin-left: 8px; }
.start span { font-size: 22px; letter-spacing: .15em; }
.start[hidden] { display: none; }
.bar { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.bar button { font: inherit; font-size: 15px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.bar button:hover { border-color: var(--accent); }
.bar input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
.time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; min-width: 92px; text-align: right; font-family: system-ui, sans-serif; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chips button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.note { margin-top: 18px; font-size: 14px; color: var(--muted); line-height: 1.7; }
</style>
</head>
<body>
<main>
  <h1>望梅止渴</h1>
  <p class="sub">國風幽默動畫・約 1 分 34 秒・旁白與角色配音，角色嘴形隨語音開合</p>
  <div class="stage">
    <canvas id="cv" width="1280" height="720"></canvas>
    <button class="start" id="start"><div class="big"></div><span>載入中…</span></button>
  </div>
  <div class="bar">
    <button id="play">▶ 播放</button>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="播放進度">
    <span class="time" id="time">0:00 / 0:00</span>
  </div>
  <div class="chips" id="chips"></div>
  <p class="note">分鏡：1 烈日荒野 ・ 2 滴水 ・ 3 軍隊癱軟 ・ 4 曹操沉思 ・ 5 靈光一閃 ・ 6 指向梅林 ・ 7 青梅幻想 ・ 8 口水直流 ・ 9 衝啊 ・ 10 抵達水源 ・ 11 成語註解</p>
</main>
<audio id="audio" src="assets/soundtrack.mp3" preload="auto"></audio>
<script src="assets/meta.js"></script>
<script src="assets/timeline.js"></script>
<script>
(() => {
const W = 1280, H = 720, TL = window.TIMELINE, META = window.SPRITES;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const audio = document.getElementById('audio');
const FONT = "'Iansui', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif";

// ---------- 工具 ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const eout = k => 1 - Math.pow(1 - k, 3);
const back = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const TAU = Math.PI * 2;

// ---------- 素材 ----------
const IMG = {};
const loadImg = n => new Promise(r => { const i = new Image(); i.onload = () => r(); i.onerror = () => r(); i.src = `assets/${n}.png`; IMG[n] = i; });
const buf = {};
function canvasFor(key, w, h) {
  let c = buf[key];
  if (!c) { c = buf[key] = document.createElement('canvas'); c.width = w; c.height = h; }
  return c;
}

// 目前角色說話的嘴巴張開程度（0~1），由配音音量包絡計算
function talk(who, t, delay = 0) {
  for (const ln of TL.lines) {
    if (ln.who !== who) continue;
    const lt = t - ln.start - delay;
    if (lt >= 0 && lt < ln.dur) {
      const i = Math.floor(lt * TL.fps), f = lt * TL.fps - i;
      return lerp(ln.env[i] || 0, ln.env[i + 1] || 0, f);
    }
  }
  return 0;
}

// 把嘴巴下方（下唇、下巴）往下移，露出口腔，做出開口說話的嘴形
function talkingImage(name, a) {
  const img = IMG[name], m = META[name];
  if (!m.mouth || a < 0.03) return img;
  const [mx, my, mw] = m.mouth, off = a * mw * 0.6;
  const O = canvasFor(name + ':o', m.w, m.h), J = canvasFor(name + ':j', m.w, m.h + 40);
  const o = O.getContext('2d'), j = J.getContext('2d');
  o.clearRect(0, 0, m.w, m.h); o.drawImage(img, 0, 0);
  o.fillStyle = '#2b0907';
  o.beginPath(); o.ellipse(mx, my + off * 0.5, mw * 0.5, off * 0.5 + 1.5, 0, 0, TAU); o.fill();
  if (off > 4) { o.fillStyle = '#b5404c'; o.beginPath(); o.ellipse(mx, my + off * 0.85, mw * 0.3, off * 0.22, 0, 0, TAU); o.fill(); }
  if (off > 6) { o.fillStyle = '#f4efe6'; o.fillRect(mx - mw * 0.3, my + 0.5, mw * 0.6, Math.min(3, off * 0.15)); }
  j.globalCompositeOperation = 'source-over';
  j.clearRect(0, 0, J.width, J.height); j.drawImage(img, 0, off);
  j.globalCompositeOperation = 'destination-in';
  j.save(); j.translate(mx, my + mw * 0.75); j.scale(1.45, 1.2);
  const g = j.createRadialGradient(0, 0, mw * 0.45, 0, 0, mw * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  j.fillStyle = g; j.fillRect(-mw * 3, -mw * 3, mw * 6, mw * 6); j.restore();
  const lg = j.createLinearGradient(0, my + off - 1.5, 0, my + off + 1.5);
  lg.addColorStop(0, 'rgba(0,0,0,0)'); lg.addColorStop(1, 'rgba(0,0,0,1)');
  j.fillStyle = lg; j.fillRect(0, 0, J.width, J.height);
  o.drawImage(J, 0, 0);
  return O;
}

// 繪製角色：(x, y) 為腳底中心（anchor='bottom'）或圖片中心（'center'）
function sprite(name, x, y, s, opt = {}) {
  const m = META[name], img = opt.talk ? talkingImage(name, opt.talk) : IMG[name];
  if (!img || !img.width) return;
  ctx.save();
  ctx.translate(x, y);
  if (opt.rot) ctx.rotate(opt.rot);
  ctx.scale(s * (opt.flip ? -1 : 1) * (opt.sx || 1), s * (opt.sy || 1));
  if (opt.alpha !== undefined) ctx.globalAlpha *= opt.alpha;
  if (opt.filter) ctx.filter = opt.filter;
  const ay = opt.anchor === 'center' ? m.h / 2 : m.h;
  ctx.drawImage(img, -m.w / 2, -ay, m.w, m.h);
  ctx.restore();
}
// 角色身上某一點（圖片像素座標）在畫面上的位置
function spritePt(name, x, y, s, px, py, opt = {}) {
  const m = META[name], ay = opt.anchor === 'center' ? m.h / 2 : m.h;
  return [x + (px - m.w / 2) * s * (opt.flip ? -1 : 1), y + (py - ay) * s];
}

// ---------- 背景元件 ----------
function sky(c1, c2, c3, horizon = H) {
  const g = ctx.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, c1); g.addColorStop(.6, c2); g.addColorStop(1, c3);
  ctx.fillStyle = g; ctx.fillRect(-W, -H, W * 4, H * 3);
}
const ridgeCache = {};
function ridge(seed, y, amp, color, x0 = -W, x1 = W * 3, period = 260) {
  const key = seed + ':' + period;
  if (!ridgeCache[key]) {
    const pts = []; for (let i = 0; i <= 160; i++) {
      const k = i / 160;
      pts.push(Math.sin(k * 23 + seed) * .5 + Math.sin(k * 57 + seed * 3) * .25 + Math.sin(k * 131 + seed * 7) * .12 + hash(seed + i) * .1);
    }
    ridgeCache[key] = pts;
  }
  const pts = ridgeCache[key], step = (x1 - x0) / 160;
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x0, H * 2);
  pts.forEach((v, i) => ctx.lineTo(x0 + i * step, y - Math.abs(v) * amp));
  ctx.lineTo(x1, H * 2); ctx.closePath(); ctx.fill();
}
function ground(y, c1, c2, cracks = true, shift = 0) {
  const g = ctx.createLinearGradient(0, y, 0, H);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(-W, y, W * 4, H * 2);
  if (!cracks) return;
  ctx.strokeStyle = 'rgba(90,50,20,.35)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (let i = 0; i < 40; i++) {
    let x = ((hash(i) * W * 3 - shift) % (W * 3) + W * 3) % (W * 3) - W, yy = y + 20 + hash(i + 50) * (H - y);
    ctx.beginPath(); ctx.moveTo(x, yy);
    for (let k = 0; k < 4; k++) { x += (hash(i * 9 + k) - .5) * 70; yy += (hash(i * 7 + k) - .3) * 18; ctx.lineTo(x, yy); }
    ctx.stroke();
  }
}
function sun(x, y, r, t, angry) {
  ctx.save(); ctx.translate(x, y);
  const glow = ctx.createRadialGradient(0, 0, r * .5, 0, 0, r * 3);
  glow.addColorStop(0, 'rgba(255,200,80,.8)'); glow.addColorStop(1, 'rgba(255,160,60,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, 0, r * 3, 0, TAU); ctx.fill();
  // 火焰
  ctx.rotate(t * .6);
  for (let i = 0; i < 18; i++) {
    const a = i / 18 * TAU, L = r * (1.35 + .25 * Math.sin(t * 9 + i * 2.1) + angry * .35);
    ctx.fillStyle = i % 2 ? '#ff7a1a' : '#ffb21f';
    ctx.beginPath();
    ctx.moveTo(Math.cos(a - .17) * r * .9, Math.sin(a - .17) * r * .9);
    ctx.quadraticCurveTo(Math.cos(a + .25) * L * .9, Math.sin(a + .25) * L * .9, Math.cos(a) * L, Math.sin(a) * L);
    ctx.lineTo(Math.cos(a + .17) * r * .9, Math.sin(a + .17) * r * .9); ctx.fill();
  }
  ctx.rotate(-t * .6);
  const body = ctx.createRadialGradient(-r * .3, -r * .3, r * .1, 0, 0, r);
  body.addColorStop(0, '#fff3a0'); body.addColorStop(.6, '#ffc53a'); body.addColorStop(1, '#ff8a1e');
  ctx.fillStyle = body; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  if (angry > 0) {
    ctx.globalAlpha = angry; ctx.strokeStyle = '#7a1d05'; ctx.fillStyle = '#7a1d05'; ctx.lineCap = 'round';
    ctx.lineWidth = r * .1;
    ctx.beginPath(); ctx.moveTo(-r * .55, -r * .42); ctx.lineTo(-r * .12, -r * .2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r * .55, -r * .42); ctx.lineTo(r * .12, -r * .2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-r * .3, -r * .02, r * .1, r * .13, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r * .3, -r * .02, r * .1, r * .13, 0, 0, TAU); ctx.fill();
    // 張牙舞爪的嘴
    ctx.fillStyle = '#7a1d05'; ctx.beginPath(); ctx.moveTo(-r * .5, r * .3);
    ctx.quadraticCurveTo(0, r * (.85 + .1 * Math.sin(t * 8)), r * .5, r * .3); ctx.quadraticCurveTo(0, r * .45, -r * .5, r * .3); ctx.fill();
    ctx.fillStyle = '#fff';
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * r * .16 - r * .06, r * .38); ctx.lineTo(i * r * .16 + r * .06, r * .38); ctx.lineTo(i * r * .16, r * .52); ctx.fill(); }
  }
  ctx.restore();
}
function heatHaze(t, alpha = .18, y0 = 250, y1 = H) {
  ctx.save(); ctx.strokeStyle = `rgba(255,240,200,${alpha})`; ctx.lineWidth = 3;
  for (let i = 0; i < 12; i++) {
    const y = y1 - ((t * 40 + i * 60) % (y1 - y0));
    ctx.beginPath();
    for (let x = -20; x <= W + 20; x += 20) ctx.lineTo(x, y + Math.sin(x * .03 + t * 4 + i) * 6);
    ctx.stroke();
  }
  ctx.restore();
}
function vignette(a = .5, color = '0,0,0') {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95);
  g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(1, `rgba(${color},${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function speedLines(t, cx, cy, color = 'rgba(255,255,255,.55)', n = 40) {
  ctx.save(); ctx.strokeStyle = color;
  for (let i = 0; i < n; i++) {
    const a = hash(i) * TAU, r0 = 260 + hash(i + 9) * 140 + ((t * 600 + i * 37) % 120), r1 = r0 + 200 + hash(i + 3) * 300;
    ctx.lineWidth = 1 + hash(i + 5) * 4;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.stroke();
  }
  ctx.restore();
}
function cloud(x, y, w, h, tail) {
  ctx.save(); ctx.fillStyle = '#fffaf0'; ctx.strokeStyle = '#1f2a44'; ctx.lineWidth = 4;
  const bumps = 9;
  ctx.beginPath();
  for (let i = 0; i < bumps; i++) {
    const a = i / bumps * TAU; ctx.ellipse(x + Math.cos(a) * w * .42, y + Math.sin(a) * h * .38, w * .2, h * .24, 0, 0, TAU);
  }
  ctx.fill();
  ctx.beginPath(); ctx.ellipse(x, y, w * .45, h * .4, 0, 0, TAU); ctx.fill();
  if (tail) for (let i = 1; i <= 3; i++) {
    const k = i / 4; ctx.beginPath(); ctx.arc(lerp(x - w * .3, tail[0], k), lerp(y + h * .4, tail[1], k), 14 - i * 3, 0, TAU); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
function text(str, x, y, size, color = '#1f2a44', opt = {}) {
  ctx.save(); ctx.font = `${opt.weight || 400} ${size}px ${FONT}`; ctx.textAlign = opt.align || 'center'; ctx.textBaseline = 'middle';
  if (opt.rot) { ctx.translate(x, y); ctx.rotate(opt.rot); x = 0; y = 0; }
  if (opt.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = opt.strokeW || size * .16; ctx.strokeStyle = opt.stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y); ctx.restore();
}
function pop(str, x, y, size, t0, t, color = '#fff', stroke = '#b3312c', rot = 0) {
  const k = seg(t, t0, t0 + .35); if (k <= 0) return;
  const s = back(k);
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  text(str, 0, 0, size, color, { stroke, rot, weight: 700 }); ctx.restore();
}
function drop(x, y, r, c = 'rgba(150,215,255,.95)') {
  ctx.save(); ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x, y - r * 1.8);
  ctx.bezierCurveTo(x + r, y - r * .5, x + r, y + r, x, y + r); ctx.bezierCurveTo(x - r, y + r, x - r, y - r * .5, x, y - r * 1.8); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.arc(x - r * .35, y, r * .25, 0, TAU); ctx.fill(); ctx.restore();
}
function sparkle(x, y, r, a = 1) {
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = '#fffbe0'; ctx.translate(x, y);
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const rr = i % 2 ? r * .22 : r; const an = i / 8 * TAU; ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
  ctx.fill(); ctx.restore();
}
function meter(label, v, x, y, hot) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(20,24,40,.65)'; roundRect(-10, -26, 300, 52, 12); ctx.fill();
  text(label, 26, 0, 24, '#fff7e6');
  ctx.fillStyle = 'rgba(255,255,255,.2)'; roundRect(60, -10, 200, 20, 10); ctx.fill();
  const g = ctx.createLinearGradient(60, 0, 260, 0);
  if (hot) { g.addColorStop(0, '#ffcf3a'); g.addColorStop(1, '#ff4b2b'); } else { g.addColorStop(0, '#9fd8ff'); g.addColorStop(1, '#5a7dbf'); }
  ctx.fillStyle = g; roundRect(60, -10, Math.max(20, 200 * v), 20, 10); ctx.fill();
  text(v < .05 ? '❄' : (hot && v > .9 ? '🔥' : ''), 278, 0, 22, '#fff');
  ctx.restore();
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function camera(cx, cy, z, fn) {
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-cx, -cy); fn(); ctx.restore();
}
function plum(x, y, r, t, i, bite = 0) {
  ctx.save(); ctx.translate(x, y);
  ctx.strokeStyle = '#5a3b1e'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * .1, -r * 1.5); ctx.stroke();
  ctx.fillStyle = '#4f8a2b'; ctx.beginPath(); ctx.ellipse(r * .45, -r * 1.25, r * .5, r * .2, -.5, 0, TAU); ctx.fill();
  const g = ctx.createRadialGradient(-r * .35, -r * .35, r * .1, 0, 0, r);
  g.addColorStop(0, '#e9ffb0'); g.addColorStop(.5, '#9ed43f'); g.addColorStop(1, '#4e8f1f');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  if (bite > 0) {
    ctx.fillStyle = '#f6f3c4';
    for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(r * .75, -r * .25 + k * r * .3, r * .28 * bite, 0, TAU); ctx.fill(); }
  }
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.ellipse(-r * .38, -r * .42, r * .22, r * .13, -.6, 0, TAU); ctx.fill();
  ctx.restore();
}
function branch() {
  ctx.save(); ctx.strokeStyle = '#4a2f18'; ctx.lineCap = 'round';
  ctx.lineWidth = 26; ctx.beginPath(); ctx.moveTo(-60, 40); ctx.bezierCurveTo(300, 120, 700, 40, 1340, 110); ctx.stroke();
  ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(380, 95); ctx.quadraticCurveTo(470, 180, 560, 200); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(860, 75); ctx.quadraticCurveTo(900, 170, 990, 215); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#5f9a32';
  for (let i = 0; i < 26; i++) {
    const x = hash(i) * 1300, y = 50 + hash(i + 40) * 140;
    ctx.save(); ctx.translate(x, y); ctx.rotate(hash(i + 80) * TAU); ctx.beginPath(); ctx.ellipse(0, 0, 34, 12, 0, 0, TAU); ctx.fill(); ctx.restore();
  }
}
function scroll(k) {  // 古風畫卷
  const w = lerp(40, 1080, eout(k)), h = 500, x = W / 2 - w / 2, y = 56;
  ctx.fillStyle = '#5b3a1f'; ctx.fillRect(x - 6, y - 6, w + 12, h + 12);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, '#f7ecd2'); g.addColorStop(1, '#eadbb8');
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#b08a52'; ctx.lineWidth = 3; ctx.strokeRect(x + 16, y + 16, w - 32, h - 32);
  for (const xx of [x - 22, x + w + 6]) {
    ctx.fillStyle = '#3d2412'; ctx.fillRect(xx, y - 30, 16, h + 60);
    ctx.fillStyle = '#c8a24e'; ctx.fillRect(xx - 4, y - 38, 24, 12); ctx.fillRect(xx - 4, y + h + 26, 24, 12);
  }

function subtitle(t) {

    const bob = run > 0 ? Math.abs(Math.sin(run * 11 + c.ph)) * 22 : 0;
    const x = c.x - Math.sin(lt * 1.3 + c.ph) * 15;
    // 揚起的塵土
    if (run > 0) for (let j = 0; j < 3; j++) { const k = (run * 2 + j / 3 + c.ph) % 1; ctx.fillStyle = `rgba(230,200,150,${.5 * (1 - k)})`; ctx.beginPath(); ctx.arc(x + 40 + k * 120, y - 5 - k * 30, 10 + k * 26, 0, TAU); ctx.fill(); }
    sprite('soldier_side', x, y - bob, s, { rot: -.16 * (1 - stand), sy: 1 + (stand > 0 ? -.15 * stand : 0) });
  });
  if (run > 0) {  // 速度線
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3;
    for (let i = 0; i < 14; i++) { const y = 120 + hash(i) * 540, x = ((run * 1400 + i * 211) % 1600) - 200; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 140, y); ctx.stroke(); }
  }
  meter('士氣', lerp(.15, 1, seg(lt, .3, 4)), 40, 50, true);
  const L = TL.lines.find(l => l.scene === 9), s0 = L.start - TL.scenes[8].start;
  if (lt > s0 - .4) {
    const a = seg(lt, s0 - .4, s0 - .1) * (1 - seg(lt, s0 + L.dur + 1.2, s0 + L.dur + 1.6));
    const r = 125, x = 1110, y = 190;
    ctx.save(); ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = '#fff3d0'; ctx.fill(); ctx.clip();
    sprite('face_happy', x, y + 145, 1.65, { talk: talk('soldiers', t) });
    ctx.restore(); ctx.save(); ctx.globalAlpha = a; inkFrame(x, y, r); ctx.restore();
    pop('衝啊！', 760, 170, 96, s0, lt, '#fff', '#b3312c', -.08);
  }
  pop('去吃青梅！', 640, 320, 64, s0 + L.dur * .45, lt, '#e9ffb0', '#3d6b1c');
};

// 10 全景拉遠：曹操意味深長地微笑，縱馬跟上
SC[10] = (lt, d, t) => {
  const k = eio(seg(lt, 0, 6));
  camera(lerp(960, 640, k), lerp(380, 360, k), lerp(1.7, 1, k), () => {
    sky('#ffc16a', '#ffdca0', '#fff0cc', 430);
    sun(200, 120, 46, t, 0);
    ridge(10, 430, 100, '#d4a26c', -W, W * 3); ground(440, '#c99555', '#a06a33', true);
    // 水源地
    const reveal = seg(lt, 4, 6);
    ctx.save(); ctx.globalAlpha = reveal;
    ctx.fillStyle = '#5fb4e0'; ctx.beginPath(); ctx.ellipse(110, 500, 190, 46, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(70, 490, 90, 10, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#4f8a2b'; ctx.lineWidth = 4;
    for (let i = 0; i < 14; i++) { const x = -60 + i * 26; ctx.beginPath(); ctx.moveTo(x, 470 + (i % 3) * 30); ctx.quadraticCurveTo(x + 6, 420, x + 12 + Math.sin(lt * 2 + i) * 4, 400 + (i % 3) * 20); ctx.stroke(); }
    sparkle(150, 480, 22 * (0.6 + .4 * Math.sin(lt * 5)), reveal); text('水源地', 120, 380, 34, '#1f4f7a', { stroke: '#fff' });
    ctx.restore();
    // 大軍如潮水般湧去
    for (let i = 0; i < 26; i++) {
      const row = i % 3, x = 900 - ((lt * (90 + row * 12) + i * 47) % 900), y = 520 + row * 32;
      sprite('soldier_side', x, y - Math.abs(Math.sin(lt * 9 + i)) * 5, .3 + row * .04, { rot: -.15 });
    }
    ctx.fillStyle = 'rgba(230,200,150,.35)';
    for (let i = 0; i < 10; i++) { ctx.beginPath(); ctx.arc(300 + i * 60 + Math.sin(lt + i) * 10, 560 + (i % 2) * 20, 40, 0, TAU); ctx.fill(); }
    const ride = seg(lt, 7.3, d);
    const cx = lerp(1010, 520, ride), cy = 600 - Math.abs(Math.sin(lt * 9)) * 6 * (ride > 0 ? 1 : 0);
    sprite('caocao_horse', cx, cy, .42, { rot: ride > 0 ? -.05 : 0 });
    if (lt > 1.5 && lt < 3.2) {
      const [ex, ey] = spritePt('caocao_horse', cx, cy, .42, 290, 112);
      sparkle(ex, ey, 26 * Math.sin(seg(lt, 1.5, 3.2) * Math.PI));
    }
  });
};

// 11 尾聲：古風畫卷定格，浮現成語註解
SC[11] = (lt, d, t) => {
  ctx.fillStyle = '#2a2320'; ctx.fillRect(0, 0, W, H);
  const [x, y, w, h] = scroll(seg(lt, 0, 1));
  if (lt < .9) return;
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  const a = seg(lt, .9, 1.5);
  ctx.globalAlpha = a;
  sprite('caocao_front', 240, 500, 1.05);
  plum(1040, 350, 40, t, 0); plum(1110, 400, 34, t, 1); plum(985, 420, 30, t, 2);
  const s = lerp(1.25, 1, eout(a));
  ctx.save(); ctx.translate(W / 2, 220); ctx.scale(s, s); text('望梅止渴', 0, 0, 130, '#1f2a44', { weight: 700 }); ctx.restore();
  ctx.globalAlpha = seg(lt, 1.8, 2.4);
  text('比喻願望無法實現，', W / 2, 375, 38, '#4a3b2a');
  text('只能用空想來慰藉自己。', W / 2, 430, 38, '#4a3b2a');
  ctx.globalAlpha = 1;
  const st = back(seg(lt, 2.8, 3.2));
  if (st > 0) {
    ctx.save(); ctx.translate(890, 490); ctx.rotate(-.08); ctx.scale(st, st);
    ctx.fillStyle = '#b3312c'; roundRect(-48, -48, 96, 96, 10); ctx.fill();
    text('成語', 0, -16, 32, '#fff3e6'); text('故事', 0, 22, 32, '#fff3e6'); ctx.restore();
  }
  ctx.restore();
};

// ---------- 主迴圈 ----------
function sceneAt(t) {
  let s = TL.scenes[0];
  for (const sc of TL.scenes) if (t >= sc.start) s = sc;
  return s;
}
function render(t) {
  t = clamp(t, 0, TL.total - .001);
  const sc = sceneAt(t), lt = t - sc.start;
  ctx.save(); ctx.clearRect(0, 0, W, H);
  SC[sc.id](lt, sc.dur, t);
  ctx.restore();
  // 轉場淡入淡出
  const fin = 1 - seg(lt, 0, .25), fout = seg(lt, sc.dur - .2, sc.dur);
  const f = sc.id === 1 ? 1 - seg(lt, 0, .8) : Math.max(fin, fout) * .9;
  if (f > 0) { ctx.fillStyle = `rgba(10,10,14,${f})`; ctx.fillRect(0, 0, W, H); }
  subtitle(t);
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = `20px ${FONT}`; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillText(`鏡 ${sc.id}`, W - 20, 16);
}
window.__render = render;
window.__ready = (async () => {
  await Promise.all(Object.keys(META).map(loadImg));
  try { await document.fonts.load(`40px Iansui`, '望梅止渴'); } catch (e) {}
})();

// ---------- 播放控制 ----------
const startBtn = document.getElementById('start'), playBtn = document.getElementById('play');
const seek = document.getElementById('seek'), timeEl = document.getElementById('time'), chips = document.getElementById('chips');
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
TL.scenes.forEach(sc => {
  const b = document.createElement('button'); b.textContent = `鏡 ${sc.id}`; b.dataset.id = sc.id;
  b.onclick = () => { audio.currentTime = sc.start + .01; if (audio.paused) draw(); };
  chips.appendChild(b);
});
function draw() {
  const t = audio.currentTime;
  render(t);
  seek.value = Math.round(t / TL.total * 1000);
  timeEl.textContent = `${fmt(t)} / ${fmt(TL.total)}`;
  const id = sceneAt(t).id;
  for (const b of chips.children) b.classList.toggle('on', +b.dataset.id === id);
}
function loop() { draw(); if (!audio.paused) requestAnimationFrame(loop); }
function play() { startBtn.hidden = true; audio.play(); }
audio.addEventListener('play', () => { playBtn.textContent = '❚❚ 暫停'; requestAnimationFrame(loop); });
audio.addEventListener('pause', () => { playBtn.textContent = '▶ 播放'; draw(); });
audio.addEventListener('ended', () => { playBtn.textContent = '↻ 重播'; });
playBtn.onclick = () => audio.paused ? play() : audio.pause();
startBtn.onclick = play;
seek.oninput = () => { audio.currentTime = seek.value / 1000 * TL.total; if (audio.paused) draw(); };
const params = new URLSearchParams(location.search);
window.__ready.then(() => {
  if (params.has('capture')) { startBtn.hidden = true; document.body.style.margin = 0; return; }
  startBtn.querySelector('span').textContent = '點擊播放（請開啟聲音）';
  render(params.has('t') ? +params.get('t') : 4.5);
  timeEl.textContent = `0:00 / ${fmt(TL.total)}`;
});
})();
</script>
