<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Claude Code 新手動畫課</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 版面概念：一台放映機。上方 16:9 動畫舞台（夜間辦公桌＋筆記格線），下方字幕條、播放控制與章節。單一深色主題，刻意固定。 */
:root{
  --page:#0d1319; --stage:#141d26; --panel:#1b2631; --panel2:#22303d; --line:#32465a; --grid:rgba(120,160,190,.07);
  --fg:#edf2f5; --mute:#94a7b6; --ai:#5fd4c4; --ai-ink:#0c2a27; --warn:#f2b63c; --add:#47c98c; --del:#f2716b; --violet:#ab9df6;
  --paper:#f3efe4; --paper-ink:#2b2a26; --wood:#5d4836; --wood2:#4a3929;
  --display:"LXGW WenKai TC","Noto Serif TC","PingFang TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono","Noto Sans TC",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{background:var(--page);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.top h1{font-family:var(--display);font-size:clamp(22px,3.4vw,32px);margin:0;text-wrap:balance}
.top p{margin:0;color:var(--mute);font-size:14px}

/* ---------- 舞台 ---------- */
.screen{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:10px;overflow:hidden;background:var(--stage);border:1px solid var(--line)}
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;font-size:22px;line-height:1.5;
  background:var(--stage);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px}
.sc{position:absolute;inset:0;padding:34px 64px 38px;display:flex;flex-direction:column;gap:16px;opacity:0;transition:opacity .5s}
.sc.show{opacity:1}
.hd{display:flex;align-items:center;gap:18px}
.tag{font:600 15px/1 var(--mono);color:var(--ai);letter-spacing:.1em;border:1.5px solid var(--ai);padding:7px 10px 6px;white-space:nowrap}
.hd h2{font:700 38px/1.2 var(--display);margin:0;text-wrap:balance}
.bd{position:relative;flex:1;min-height:0}

/* 出場狀態 */
[data-s]{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
[data-s].on{opacity:1;transform:none}
.pop[data-s]{transform:scale(.8)}
.sl[data-s]{transform:translateX(-36px)}
.sr[data-s]{transform:translateX(36px)}
.pop[data-s].on,.sl[data-s].on,.sr[data-s].on{transform:none}
[data-x],[data-c]{transition:opacity .5s ease,transform .6s ease}
[data-c]{opacity:0}
[data-c].cur{opacity:1}
[data-x].gone{opacity:0!important;transform:scale(.92)!important;pointer-events:none}
.type{clip-path:inset(0 100% 0 0);transition:clip-path 1.6s steps(28),opacity .3s}
.type.on{clip-path:inset(0 0 0 0)}
.stack{display:grid}
.stack>*{grid-area:1/1}

/* 通用元件 */
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:18px 22px}
.bubble{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:16px;padding:12px 18px;font-size:21px;line-height:1.45;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.bubble.me{background:var(--ai);color:var(--ai-ink)}
.bubble.ai{background:var(--panel2);color:var(--fg);border:1.5px solid var(--line)}
.who{display:block;font:600 13px var(--mono);letter-spacing:.08em;opacity:.7;margin-bottom:2px}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:2.2em;padding:0 .4em;height:1.6em;border-radius:6px;background:var(--paper);color:var(--paper-ink);font:700 .8em var(--mono);box-shadow:0 3px 0 #9b968a;vertical-align:.1em}
.mono{font-family:var(--mono)}
.hlA{color:var(--ai)}.hlW{color:var(--warn)}.hlD{color:var(--del)}.hlG{color:var(--add)}.hlV{color:var(--violet)}
.mut{color:var(--mute)}
.badge{display:inline-block;font:700 14px/1 var(--body);padding:6px 9px;border-radius:5px;background:var(--warn);color:#2b1d00;letter-spacing:.04em;vertical-align:middle}
.file{position:relative;width:78px;height:96px;background:var(--paper);border-radius:4px;color:var(--paper-ink);display:flex;align-items:flex-end;justify-content:center;padding:6px;font-size:12px;line-height:1.2;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.file i{position:absolute;left:12px;right:12px;top:16px;height:30px;background:repeating-linear-gradient(#bdb6a5 0 3px,transparent 3px 9px)}
.term{background:#0a0f14;border:1.5px solid var(--line);border-radius:10px;padding:18px 20px;font:15px/1.65 var(--mono);color:#c9d6df}
.term .ln{white-space:pre-wrap}
.term .t-h{color:var(--mute)}
.keycap{width:150px;height:130px;border-radius:18px;background:var(--paper);color:var(--paper-ink);display:flex;align-items:center;justify-content:center;font:700 46px var(--mono);box-shadow:0 14px 0 #9b968a,0 18px 30px rgba(0,0,0,.4);transition:transform .15s,box-shadow .15s}
.keycap.act{animation:press 1.4s ease 1 both}
@keyframes press{0%,100%{transform:none;box-shadow:0 14px 0 #9b968a,0 18px 30px rgba(0,0,0,.4)}35%,55%{transform:translateY(12px);box-shadow:0 2px 0 #9b968a,0 4px 10px rgba(0,0,0,.4);background:var(--warn)}}

/* ---------- 各場景 ---------- */
/* 片頭 */
.title-sc{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 110px;gap:22px}
.title-sc .eyebrow{font:600 18px var(--mono);letter-spacing:.2em;color:var(--ai)}
.title-sc h1{font:700 104px/1.05 var(--display);margin:0}
.title-sc h1 span{color:var(--warn)}
.title-sc p{font-size:28px;color:var(--mute);margin:0}
.eps{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.eps div{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 16px;font-size:19px}
.eps b{font-family:var(--mono);color:var(--ai);margin-right:8px}
.title-cursor{position:absolute;right:110px;bottom:90px;font:600 20px var(--mono);color:var(--mute)}
.title-cursor::after{content:"▍";color:var(--ai);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* 心法 */
.quote{font:700 30px var(--display);color:var(--mute);text-align:center;margin-top:10px}
.flow4{display:flex;align-items:stretch;justify-content:center;gap:14px;margin-top:40px}
.tile{width:240px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:10px}
.tile .n{font:600 16px var(--mono);color:var(--mute)}
.tile b{font:700 48px/1.1 var(--display)}
.tile p{margin:0;font-size:18px;color:var(--mute);line-height:1.5}
.tile.on{border-color:var(--ai)}
.tile:nth-child(1) b{color:var(--ai)}.tile:nth-child(3) b{color:var(--violet)}.tile:nth-child(5) b{color:var(--warn)}.tile:nth-child(7) b{color:var(--add)}
.arr{align-self:center;font-size:34px;color:var(--mute)}

/* Chatbot vs Agent */
.vs{display:flex;gap:26px;height:100%}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:18px 24px}
.col.ai{border-color:var(--ai)}
.col-h{display:flex;align-items:baseline;gap:12px}
.col-h b{font:700 32px var(--display)}
.col-h em{font:600 15px var(--mono);font-style:normal;color:var(--mute)}
.col.ai .col-h b{color:var(--ai)}
.col-sub{margin:0;font-size:22px}
.ill{position:relative;flex:1}
.cap{margin:0;font-size:19px;color:var(--mute)}
.vs-mid{align-self:center;font:700 26px var(--mono);color:var(--mute)}
.phone{position:absolute;left:16px;top:30px;width:70px;color:var(--mute)}
.ill .bubble{position:absolute;left:110px;top:24px}
.messy{position:absolute;left:30px;right:10px;bottom:6px;height:150px}
.messy .file{position:absolute}
.messy .m0{left:10px;top:30px;transform:rotate(-14deg)}.messy .m1{left:110px;top:10px;transform:rotate(9deg)}
.messy .m2{left:205px;top:40px;transform:rotate(-5deg)}.messy .m3{left:300px;top:14px;transform:rotate(16deg)}.messy .m4{left:390px;top:44px;transform:rotate(-10deg)}
.messy.on .file{animation:wob 2.4s ease-in-out infinite}
@keyframes wob{50%{translate:0 -6px}}
.fgrid{position:absolute;left:4px;top:28px;display:grid;grid-template-columns:repeat(4,46px);gap:10px}
.fgrid .f{height:56px;background:var(--paper);color:var(--paper-ink);border-radius:3px;font:600 13px var(--mono);display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;transition:transform .8s cubic-bezier(.5,0,.2,1),opacity .8s;transition-delay:calc(var(--i)*90ms)}
.fgrid.act .f{transform:translate(250px,10px) scale(.3);opacity:0}
.arrow-r{position:absolute;left:232px;top:96px;font-size:34px;color:var(--ai)}
.sheet{position:absolute;right:4px;top:12px;width:250px;background:var(--paper);color:var(--paper-ink);border-radius:6px;font-size:15px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.sheet .sh-h{background:#2f7d72;color:#fff;font:600 13px var(--mono);padding:6px 10px}
.sheet .r{display:flex;justify-content:space-between;padding:4px 10px;border-bottom:1px solid #d9d2c1}
.sheet .r span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sheet .sh-t{padding:6px 10px;font-weight:700;color:#2f7d72}

/* 四大能力 */
.abil{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px}
.abil .card{display:flex;gap:18px;align-items:flex-start}
.abil .ic{flex:none;width:58px;height:58px;border-radius:12px;background:var(--panel2);border:1.5px solid var(--ai);color:var(--ai);display:flex;align-items:center;justify-content:center;font:700 24px var(--mono)}
.abil b{font:700 28px var(--display);display:block}
.abil p{margin:4px 0 0;font-size:19px;color:var(--mute)}
.abil .ex{display:block;margin-top:8px;font-size:17px;color:var(--fg);font-family:var(--mono)}
.lead{font-size:24px;margin:0 0 4px;color:var(--mute)}

/* 代理迴圈 */
.loop{display:flex;gap:34px;height:100%}
.ring{position:relative;flex:none;width:470px;height:500px}
.ring .circle{position:absolute;left:55px;top:50px;width:360px;height:360px;border-radius:50%;border:3px dashed var(--line);animation:spin 30s linear infinite}
.ring .center{position:absolute;left:135px;top:185px;width:200px;text-align:center}
.ring .center b{font:700 34px var(--display);display:block}
.ring .center span{font:600 15px var(--mono);color:var(--mute)}
.node{position:absolute;width:132px;margin-left:-66px;margin-top:-30px;text-align:center;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 6px;font-size:17px;line-height:1.3;transition:all .5s}
.node em{display:block;font:600 13px var(--mono);font-style:normal;color:var(--mute)}
.node.act{border-color:var(--ai)}
.node.hl{background:var(--ai);color:var(--ai-ink);border-color:var(--ai);transform:scale(1.12)}
.node.hl em{color:var(--ai-ink)}
.node.warn.hl{background:var(--warn);border-color:var(--warn);color:#2b1d00}
.loop .term{flex:1;min-width:0;align-self:center}
.term .w{color:var(--warn)}.term .g{color:var(--add)}.term .a{color:var(--ai)}

/* ESC */
.esc{display:flex;gap:56px;align-items:center;height:100%}
.esc-l{flex:none;display:flex;flex-direction:column;align-items:center;gap:30px;width:300px}
.esc-l .cap{text-align:center;font-size:22px}
.esc-r{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
.wheel{font:700 34px var(--display);color:var(--warn)}

/* 權限 */
.perm{display:flex;flex-direction:column;gap:26px;padding-top:8px}
.track-row{display:flex;gap:18px;align-items:center}
.track{position:relative;width:860px;height:96px;background:var(--panel);border:1.5px solid var(--line);border-radius:48px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;text-align:center}
.track .stop{position:relative;z-index:1;font-size:20px;line-height:1.25;transition:color .4s}
.track .stop small{display:block;font:600 13px var(--mono);color:var(--mute)}
.track .stop.hl{color:var(--ai-ink)}
.track .stop.hl small{color:var(--ai-ink)}
.knob{position:absolute;top:8px;bottom:8px;width:205px;left:calc(var(--kx,0) * 215px + 5px);border-radius:40px;background:var(--ai);transition:left .8s cubic-bezier(.5,0,.2,1),opacity .5s,transform .5s}
.bypass{position:relative;width:240px;height:96px;border:2px dashed #555f69;border-radius:14px;color:#6c7781;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;line-height:1.3}
.bypass small{font:600 13px var(--mono)}
.stamp{position:absolute;inset:-10px -16px;display:flex;align-items:center;justify-content:center;font:900 34px var(--body);color:var(--del);border:4px solid var(--del);border-radius:10px;transform:rotate(-9deg);background:rgba(20,29,38,.75)}
.stamp[data-s]{transform:rotate(-9deg) scale(2)}
.stamp[data-s].on{transform:rotate(-9deg)}
.pdesc{position:relative;height:250px}
.pdesc>*{position:absolute;inset:0}
.pdesc .card{display:flex;flex-direction:column;gap:10px;padding:26px 32px}
.pdesc h3{margin:0;font:700 36px var(--display)}
.pdesc h3 .badge{margin-left:12px}
.pdesc p{margin:0;font-size:24px;line-height:1.6}
.pdesc .bubble{align-self:flex-start;font-size:24px}

/* 入口 */
.entry{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:20px}
.entry .card{display:flex;flex-direction:column;gap:12px;min-height:330px;transition:opacity .6s,border-color .6s,transform .6s}
.entry .mock{height:110px;border-radius:8px;padding:12px;font:14px/1.5 var(--mono)}
.mock.t{background:#05080b;color:#9fe0b2}
.mock.v{background:#1e1e2a;color:#c9c6f4;display:grid;grid-template-columns:40px 1fr;gap:8px}
.mock.v i{background:#2b2b3b;border-radius:4px}
.mock.a{background:var(--paper);color:var(--paper-ink);font-family:var(--body);font-size:15px;display:flex;flex-direction:column;gap:6px}
.mock.a span{align-self:flex-end;background:var(--ai);color:var(--ai-ink);padding:2px 10px;border-radius:10px}
.entry b{font:700 30px var(--display)}
.entry p{margin:0;font-size:19px;color:var(--mute)}
.entry.act .card.dim{opacity:.35}
.entry.act .card.best{border-color:var(--warn);transform:translateY(-8px)}

/* 資料夾 */
.fold{position:relative;height:100%}
.desk-area{position:absolute;left:0;top:10px;width:470px;height:430px;border:2px dashed var(--line);border-radius:14px;padding:16px}
.desk-area .lab{font:600 16px var(--mono);color:var(--mute)}
.desk-files{display:grid;grid-template-columns:repeat(4,78px);gap:22px 26px;margin-top:16px}
.bigx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--del);font:900 150px/1 var(--body)}
.bigx span{font:700 24px var(--body);background:var(--stage);padding:4px 12px;border-radius:6px}
.folder{position:absolute;left:720px;top:120px;width:300px;height:220px}
.folder::before{content:"";position:absolute;left:0;top:0;width:120px;height:36px;background:#d29a2e;border-radius:10px 10px 0 0}
.folder::after{content:"";position:absolute;left:0;top:24px;right:0;bottom:0;background:var(--warn);border-radius:0 12px 12px 12px}
.folder span{position:absolute;z-index:2;left:0;right:0;bottom:22px;text-align:center;font:700 30px var(--display);color:#2b1d00}
.copy{position:absolute;z-index:3}
.copy[data-s]{transform:none;opacity:0}
.copy[data-s].on{opacity:1;transform:translate(var(--tx),var(--ty)) scale(.62)}
.copy-lab{position:absolute;left:520px;top:30px;font:700 26px var(--display);color:var(--warn)}
.shield{position:absolute;left:40px;top:455px;font-size:22px;color:var(--add)}

/* 提示詞四零件 */
.pr{display:flex;flex-direction:column;gap:18px}
.inbox{display:flex;align-items:center;gap:14px;background:var(--paper);color:var(--paper-ink);border-radius:12px;padding:14px 20px;font-size:26px;width:fit-content}
.inbox .cur{width:3px;height:30px;background:var(--paper-ink);animation:blink 1s steps(2) infinite}
.qm{display:flex;gap:18px;margin-left:20px}
.qm span{font:700 22px var(--body);color:var(--warn);background:var(--panel);border:1.5px dashed var(--warn);border-radius:20px;padding:6px 16px}
.pieces{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.piece{border-radius:12px;padding:14px 16px;background:var(--panel);border:2px solid var(--pc);display:flex;flex-direction:column;gap:6px}
.piece .pn{font:700 16px var(--mono);color:var(--pc)}
.piece b{font:700 26px var(--display);color:var(--pc)}
.piece p{margin:0;font-size:18px;line-height:1.45}
.assembled{background:var(--paper);color:var(--paper-ink);border-radius:12px;padding:16px 22px;font-size:22px;line-height:1.6}
.assembled u{text-decoration:none;border-bottom:4px solid var(--pc);padding-bottom:1px}

/* 計劃模式 */
.plan{display:flex;gap:30px;height:100%}
.plan ol{list-style:none;margin:0;padding:0;width:440px;display:flex;flex-direction:column;gap:12px}
.plan li{display:flex;gap:14px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;transition:all .4s}
.plan li b{flex:none;width:44px;height:44px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font:700 22px var(--mono);color:var(--ai)}
.plan li div{font-size:20px;line-height:1.4}
.plan li small{display:block;color:var(--mute);font-size:16px}
.plan li.hl{border-color:var(--ai);background:var(--panel2)}
.win{position:relative;flex:1;min-width:0;background:var(--paper);color:var(--paper-ink);border-radius:14px;overflow:hidden}
.win .bar{height:34px;background:#ddd6c6;display:flex;align-items:center;gap:7px;padding-left:14px}
.win .bar i{width:11px;height:11px;border-radius:50%;background:#b5ad9b}
.win .pane{position:absolute;left:0;right:0;top:34px;bottom:0;padding:24px 28px;display:flex;flex-direction:column;gap:14px;font-size:20px}
.pill{align-self:flex-start;border-radius:20px;padding:6px 16px;font-weight:700;font-size:18px;border:2px solid #2f7d72;color:#2f7d72}
.pill.big{font-size:24px;background:#2f7d72;color:#fff}
.opt{display:flex;align-items:center;gap:10px;border:2px solid #cfc7b4;border-radius:10px;padding:10px 14px}
.opt.rec{border-color:#2f7d72}
.btns{display:flex;gap:12px;margin-top:auto}
.btn{border-radius:8px;padding:8px 20px;font-weight:700;border:2px solid #2b2a26}
.btn.pri{background:#2b2a26;color:var(--paper)}
.btn.glow{box-shadow:0 0 0 5px rgba(242,182,60,.65)}
.strike{text-decoration:line-through;color:#a2412f;font-size:17px}

/* 辦公桌 */
.deskbox{position:relative;height:100%}
.tabletop{position:absolute;left:120px;right:120px;bottom:40px;height:260px;background:linear-gradient(var(--wood),var(--wood2));border-radius:18px;box-shadow:0 18px 0 #2d2219}
.paper{position:absolute;width:120px;height:150px;background:var(--paper);border-radius:4px;box-shadow:0 5px 0 rgba(0,0,0,.25);color:var(--paper-ink);font-size:13px;padding:8px;line-height:1.3}
.paper::after{content:"";position:absolute;left:12px;right:12px;top:42px;height:70px;background:repeating-linear-gradient(#c4bca9 0 3px,transparent 3px 11px)}
.handbook{position:absolute;left:50%;bottom:110px;width:250px;margin-left:-125px;height:170px;background:#2f7d72;color:#fff;border-radius:8px;box-shadow:0 8px 0 #1c4c45;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;z-index:3}
.handbook b{font:700 32px var(--mono)}
.handbook span{font-size:18px}
.handbook[data-s]{transform:translateY(-260px)}
.handbook[data-s].on{transform:none}
.handbook.act{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 8px 0 #1c4c45,0 0 0 14px rgba(95,212,196,.3)}}
.newchat{position:absolute;left:50%;top:10px;transform:translateX(-50%);font:700 26px var(--display);color:var(--ai);background:var(--panel);border:1.5px solid var(--ai);border-radius:10px;padding:8px 22px;white-space:nowrap}
.newchat[data-s]{transform:translateX(-50%) translateY(16px)}
.newchat[data-s].on{transform:translateX(-50%)}
.desk-note{position:absolute;left:0;top:0;font-size:22px;color:var(--mute);max-width:360px}

/* CLAUDE.md 文件 */
.two{display:flex;gap:30px;height:100%;align-items:flex-start}
.chat{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.chat .bubble{max-width:92%}
.chat .me{align-self:flex-end}
.doc{flex:1;min-width:0;background:var(--paper);color:var(--paper-ink);border-radius:10px;padding:22px 26px;font:17px/1.75 var(--mono);box-shadow:0 8px 0 rgba(0,0,0,.25)}
.doc .h{font-weight:600;color:#2f7d72}
.doc .add{background:#cfeedc;color:#14532f;margin:2px -10px;padding:2px 10px;border-left:5px solid var(--add)}
.doc .fn{font:600 14px var(--mono);color:#7a7466;margin-bottom:6px}

/* 記憶條 */
.meterbox{display:flex;flex-direction:column;gap:22px}
.meter-row{display:flex;align-items:center;gap:20px}
.meter-row .lab{font-size:22px;width:170px}
.meter{position:relative;flex:1;height:44px;border-radius:8px;background:var(--panel);border:1.5px solid var(--line);overflow:hidden}
.meter .fill{position:absolute;left:0;top:0;bottom:0;width:var(--m,10%);background:var(--mc,var(--ai));transition:width 1.1s cubic-bezier(.5,0,.2,1),background .6s}
.meter .mark{position:absolute;left:70%;top:-2px;bottom:-2px;border-left:2px dashed var(--fg);opacity:.5}
.meter .mark::after{content:"70%";position:absolute;left:6px;top:8px;font:600 15px var(--mono)}
.mnum{font:700 30px var(--mono);width:110px;text-align:right;font-variant-numeric:tabular-nums}
.acts{display:flex;flex-direction:column;gap:14px}
.act-row{display:grid;grid-template-columns:300px 260px 1fr;gap:18px;align-items:center;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px 20px;font-size:19px}
.act-row .k{font-size:20px}
.act-row .do{font:600 20px var(--mono);color:var(--ai)}
.act-row .why{color:var(--mute)}

.vs2{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.vs2 .card{display:flex;flex-direction:column;gap:12px;min-height:300px}
.vs2 h3{margin:0;font:700 32px var(--display)}
.vs2 h3 small{font:600 15px var(--mono);color:var(--mute);margin-left:8px}
.vs2 p{margin:0;font-size:21px}
.vs2 ul{margin:0;padding-left:1.2em;font-size:19px;color:var(--mute)}
.tips{display:flex;gap:16px;margin-top:20px;align-items:center}
.tips .bubble{font-size:20px}

/* 先看一遍 */
.badloop{position:absolute;right:0;top:0;width:420px;height:300px}
.badloop .bl{position:absolute;font-size:19px;background:var(--panel);border:1.5px solid var(--del);border-radius:8px;padding:6px 12px;color:var(--del);white-space:nowrap}
.badloop .spin{position:absolute;left:135px;top:75px;width:150px;height:150px;border-radius:50%;border:4px dashed var(--del);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.look{display:flex;flex-direction:column;gap:20px;max-width:760px}
.look .bubble{font-size:22px}
.look mark{background:var(--warn);color:#2b1d00;padding:0 4px;border-radius:3px}
.choice{display:flex;gap:14px;align-items:center}
.choice .opt2{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:10px 18px;font-size:20px}
.choice .opt2.rec{border-color:var(--ai)}

/* Diff */
.diffwrap{display:flex;gap:30px;height:100%}
.diff{flex:none;width:700px;align-self:flex-start;background:#0a0f14;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;font:15.5px/1.5 var(--mono)}
.diff .fh{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1.5px solid var(--line);font-size:15px}
.diff .fh .tri{color:var(--ai);display:inline-block;transition:transform .5s}
.diff .fh .tri.act{transform:rotate(90deg)}
.diff .ln{display:flex;gap:12px;padding:5px 14px;white-space:nowrap}
.diff .ln .no{color:#56687a;width:20px;text-align:right}
.diff .ln .sg{width:12px}
.diff .ln.del{background:rgba(242,113,107,.16);color:#ffb0aa}
.diff .ln.add{background:rgba(71,201,140,.16);color:#9cf0c3}
.diff .ln.add.hl b,.diff .ln.del.hl b{outline:2px solid var(--warn);border-radius:3px}
.flags{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.flags h3{margin:0;font:700 28px var(--display);color:var(--warn)}
.flag{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1.5px solid var(--line);border-left:6px solid var(--del);border-radius:8px;padding:12px 16px;font-size:20px;line-height:1.45}
.flag b{flex:none;font:700 22px var(--mono);color:var(--del)}
.legend{display:flex;gap:22px;font-size:19px;margin-top:6px}
.legend span::before{content:"";display:inline-block;width:16px;height:16px;border-radius:3px;margin-right:8px;vertical-align:-2px;background:var(--c)}

/* 倒回 */
.rw{display:flex;gap:40px;height:100%}
.rw-chat{flex:none;width:560px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:12px;align-items:center;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:12px 16px;font-size:19px;transition:all .5s}
.msg b{flex:none;font:600 14px var(--mono);color:var(--mute)}
.msg .st{margin-left:auto;font-weight:700}
.msg.bad{border-color:var(--del)}
.msg.hl{background:var(--warn);color:#2b1d00;border-color:var(--warn)}
.msg.hl b{color:#2b1d00}
.input2{margin-top:auto;display:flex;align-items:center;gap:10px;background:var(--paper);color:var(--paper-ink);border-radius:10px;padding:12px 16px;font-size:19px;min-height:54px}
.input2 .ph{color:#9b968a}
.rw-r{flex:1;min-width:0;display:flex;flex-direction:column;gap:22px;align-items:center}
.modal{width:100%;background:var(--panel2);border:1.5px solid var(--ai);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:10px;font-size:18px}
.modal h4{margin:0;font-size:20px}
.modal .o{border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;transition:all .4s}
.modal .o.hl{border-color:var(--warn);background:rgba(242,182,60,.15)}
.clock{font:700 26px var(--display);color:var(--warn);display:flex;align-items:center;gap:12px}
.clock i{display:inline-block;width:46px;height:46px;border-radius:50%;border:4px solid var(--warn);position:relative}
.clock i::after{content:"";position:absolute;left:19px;top:6px;width:4px;height:16px;background:var(--warn);transform-origin:2px 14px}
.clock.act i::after{animation:rev 1.2s linear 2}
@keyframes rev{to{transform:rotate(-360deg)}}
.ok-banner{background:rgba(71,201,140,.15);border:1.5px solid var(--add);border-radius:10px;padding:12px 16px;font-size:19px;color:var(--fg)}

/* 派幫手 */
.sub{position:relative;height:100%}
.dk{position:absolute;top:70px;width:500px;height:300px;border-radius:16px;background:var(--panel);border:1.5px solid var(--line);padding:16px 20px}
.dk h4{margin:0 0 6px;font:700 26px var(--display)}
.dk.main{left:0}
.dk.help{right:0;border-color:var(--violet)}
.dk.help h4{color:var(--violet)}
.dk .meter{height:30px;flex:1}
.dk .mrow{display:flex;align-items:center;gap:12px}
.dk .mnum{font-size:22px;width:70px}
.pile{position:absolute;left:30px;right:30px;bottom:18px;height:150px}
.pile .file{position:absolute;width:62px;height:76px;transform:rotate(var(--r))}
.pile .file i{top:12px;height:24px}
.note{position:absolute;left:150px;top:200px;z-index:4;background:var(--warn);color:#2b1d00;border-radius:6px;padding:10px 16px;font-size:19px;font-weight:700;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.note[data-s]{transform:translateX(560px) rotate(4deg)}
.note[data-s].on{transform:rotate(-2deg)}
.sub .bubble{position:absolute;left:0;right:0;bottom:0;font-size:21px}
.sub .tip{position:absolute;left:0;bottom:0;right:0;display:flex;gap:16px;align-items:center}
.sub .tip .bubble{position:static;flex:1}
.sub .tip b{flex:none;font:700 24px var(--display);color:var(--violet)}

/* 技能 */
.rep{display:flex;flex-direction:column;gap:14px;width:720px}
.rep .bubble{font-size:21px}
.rep .cnt{font:700 15px var(--mono);margin-right:10px;background:var(--ai-ink);color:var(--warn);padding:2px 6px;border-radius:4px}
.pkg{position:absolute;right:30px;top:60px;width:300px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.box{width:170px;height:140px;background:#b98a4f;border-radius:8px;position:relative;box-shadow:0 10px 0 #7d5a30}
.box::before{content:"";position:absolute;left:-8px;right:-8px;top:-18px;height:34px;background:#cf9d5d;border-radius:6px}
.box::after{content:"SKILL";position:absolute;left:0;right:0;top:56px;text-align:center;font:700 26px var(--mono);color:#3a2610}
.box.act{animation:bounce 1s ease 2}
@keyframes bounce{40%{transform:translateY(-16px)}}
.pkg b{font:700 30px var(--display);color:var(--warn)}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:6px}
.steps3 .card{display:flex;flex-direction:column;gap:12px;min-height:400px}
.steps3 .n{font:700 52px/1 var(--mono);color:var(--ai)}
.steps3 b{font:700 30px var(--display)}
.steps3 p{margin:0;font-size:19px;color:var(--mute)}
.steps3 .bubble{font-size:18px}
.chip{align-self:flex-start;border-radius:6px;padding:4px 10px;font:600 15px var(--mono);border:1.5px solid var(--add);color:var(--add)}

.anat{display:flex;gap:36px;height:100%}
.skdoc{flex:none;width:560px;background:var(--paper);color:var(--paper-ink);border-radius:10px;padding:20px 26px;font:16.5px/1.7 var(--mono);box-shadow:0 8px 0 rgba(0,0,0,.25)}
.skdoc .sec{border-radius:6px;padding:6px 10px;margin:4px -10px;transition:background .4s,box-shadow .4s}
.skdoc .sec.hl{background:#f6dfa4;box-shadow:inset 5px 0 0 var(--warn)}
.skdoc .h{font-weight:600;color:#2f7d72}
.skdoc .add{background:#cfeedc;color:#14532f;border-left:5px solid var(--add);padding-left:8px;margin-left:-13px}
.anat-r{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
.anat-r .card b{font:700 26px var(--display)}
.anat-r .card p{margin:4px 0 0;font-size:19px;color:var(--mute)}

.drw{position:relative;height:100%}
.d-top{position:absolute;left:60px;right:60px;top:40px;height:150px;background:linear-gradient(var(--wood),var(--wood2));border-radius:14px 14px 0 0}
.d-body{position:absolute;left:60px;right:60px;top:190px;height:220px;background:#3f3124;border-radius:0 0 14px 14px}
.drawer{position:absolute;left:320px;width:500px;top:230px;height:130px;background:#6d543c;border-radius:8px;box-shadow:inset 0 -6px 0 #4a3929;transition:transform .9s cubic-bezier(.5,0,.2,1);z-index:2}
.drawer.act{transform:translateY(110px) scale(1.04)}
.drawer .handle{position:absolute;left:50%;top:14px;width:80px;margin-left:-40px;height:12px;border-radius:6px;background:#c8b18b}
.drawer .labels{position:absolute;left:16px;right:16px;bottom:16px;display:flex;gap:10px}
.drawer .labels span{flex:1;background:var(--paper);color:var(--paper-ink);border-radius:5px;padding:6px 4px;font-size:16px;text-align:center;transition:transform .6s,background .4s}
.drawer.act .labels .pick{transform:translateY(-70px);background:var(--warn)}
.pinned{position:absolute;left:150px;top:62px;width:260px;background:#2f7d72;color:#fff;border-radius:6px;padding:10px 14px;font-size:17px;transform:rotate(-2deg);box-shadow:0 6px 0 #1c4c45;z-index:2}
.pinned b{font:700 22px var(--mono);display:block}
.pinned[data-s]{transform:rotate(-2deg) translateY(-30px)}
.pinned[data-s].on{transform:rotate(-2deg)}
.drw .lab-l,.drw .lab-r{position:absolute;font-size:21px;line-height:1.45}
.drw .lab-l{left:450px;top:58px;max-width:560px}
.drw .lab-r{left:860px;top:250px;max-width:300px}
.motto{position:absolute;left:0;right:0;bottom:0;text-align:center;font:700 26px var(--display);background:var(--panel);border:1.5px solid var(--warn);border-radius:12px;padding:12px 18px}
.motto em{font-style:normal;color:var(--warn)}

.quiz{position:relative;height:100%}
.bin{position:absolute;bottom:0;width:440px;height:260px;border:2px solid var(--line);border-radius:16px;background:var(--panel);padding:14px 20px}
.bin h4{margin:0;font:700 26px var(--display);text-align:center}
.bin.l{left:40px;border-color:var(--ai)}.bin.l h4{color:var(--ai)}
.bin.r{right:40px;border-color:var(--warn)}.bin.r h4{color:var(--warn)}
.qcard{position:absolute;left:50%;top:30px;width:460px;margin-left:-230px;min-height:120px;background:var(--paper);color:var(--paper-ink);border-radius:12px;padding:16px 20px;font-size:22px;line-height:1.45;box-shadow:0 8px 0 rgba(0,0,0,.3);z-index:3}
.qcard small{display:block;font:600 14px var(--mono);color:#7a7466}
.qcard.on{animation:qfly 3.2s ease forwards}
@keyframes qfly{0%{opacity:0;transform:translateY(24px)}12%{opacity:1;transform:none}62%{opacity:1;transform:none}100%{opacity:1;transform:translate(var(--tx),var(--ty)) scale(.5)}}
.quiz .lead{position:absolute;left:0;right:0;top:0;text-align:center}

/* 速查 */
.cheat{width:100%;border-collapse:separate;border-spacing:0 10px;font-size:20px}
.cheat td{background:var(--panel);padding:12px 18px;border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line)}
.cheat td:first-child{border-left:1.5px solid var(--line);border-radius:10px 0 0 10px;width:230px;font:700 22px var(--mono);color:var(--ai)}
.cheat td:nth-child(2){width:260px;color:var(--mute)}
.cheat td:last-child{border-right:1.5px solid var(--line);border-radius:0 10px 10px 0}
.cheat tr[data-s]{transform:translateX(-30px)}
.cheat tr[data-s].on{transform:none}

.recap{display:flex;gap:36px;height:100%}
.chk{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;align-content:start}
.chk div{display:flex;gap:10px;align-items:flex-start;font-size:18px;line-height:1.4;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px}
.chk b{flex:none;width:28px;height:28px;border-radius:6px;background:var(--add);color:#06301c;display:flex;align-items:center;justify-content:center;font:700 15px var(--mono)}
.endcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:var(--stage);text-align:center}
.endcard h3{margin:0;font:700 64px/1.2 var(--display)}
.endcard h3 span:nth-child(1){color:var(--ai)}.endcard h3 span:nth-child(2){color:var(--violet)}.endcard h3 span:nth-child(3){color:var(--warn)}.endcard h3 span:nth-child(4){color:var(--add)}
.endcard p{margin:0;font-size:20px;color:var(--mute);max-width:820px}

/* 開始覆蓋層 */
.cover{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(10,15,20,.55);border:0;cursor:pointer;color:var(--fg);font:inherit;padding:0}
.cover span{display:flex;align-items:center;gap:12px;background:var(--ai);color:var(--ai-ink);font:700 clamp(16px,2.4vw,24px) var(--body);padding:.7em 1.4em;border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.cover:focus-visible span{outline:3px solid var(--warn);outline-offset:4px}

/* ---------- 字幕與控制 ---------- */
.sub-bar{min-height:3.6em;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 18px;display:flex;gap:14px;align-items:flex-start}
.sub-bar .who2{flex:none;font:600 13px var(--mono);color:var(--ai);border:1px solid var(--ai);border-radius:4px;padding:2px 6px;margin-top:3px}
#subtitle{font-size:clamp(16px,2.2vw,20px);line-height:1.6;margin:0}
.prog{display:flex;gap:3px;height:10px}
.prog button{flex:1;min-width:0;border:0;padding:0;background:var(--panel2);border-radius:2px;cursor:pointer;position:relative;overflow:hidden}
.prog button i{position:absolute;inset:0;width:var(--p,0%);background:var(--ai);transition:width .4s}
.prog button:focus-visible{outline:2px solid var(--warn)}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ctrl button,.ctrl select{font:600 15px var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
.ctrl button:hover,.ctrl select:hover{border-color:var(--ai)}
.ctrl button:focus-visible,.ctrl select:focus-visible,.chaps button:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.ctrl #play{background:var(--ai);color:var(--ai-ink);border-color:var(--ai);min-width:96px}
.ctrl .pos{margin-left:auto;font:600 14px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums}
.ctrl label{font-size:14px;color:var(--mute);display:flex;align-items:center;gap:6px}
.chaps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.chaps button{text-align:left;font:500 14px/1.35 var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.chaps button b{display:block;font:700 13px var(--mono);color:var(--mute)}
.chaps button.cur{border-color:var(--ai)}
.chaps button.cur b{color:var(--ai)}
.foot{font-size:13px;color:var(--mute);margin:6px 0 0}
.keys{font-size:13px;color:var(--mute)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Claude Code 新手動畫課</h1>
    <p>非工程師實戰 · 全 5 集重點動畫 · 附語音旁白</p>
  </header>

  <div class="screen" id="screen">
    <div class="stage" id="stage"></div>
    <button class="cover" id="cover" type="button" aria-label="開始播放動畫"><span>▶ 開始播放（建議開啟聲音）</span></button>
  </div>

  <div class="sub-bar" aria-live="polite"><span class="who2">旁白</span><p id="subtitle">按下播放，從第一幕開始。</p></div>
  <div class="prog" id="prog" aria-label="場景進度"></div>
  <div class="ctrl">
    <button id="prevS" type="button" title="上一幕">⏮ 上一幕</button>
    <button id="prev" type="button" title="上一句（←）">◀ 上一句</button>
    <button id="play" type="button">▶ 播放</button>
    <button id="next" type="button" title="下一句（→）">下一句 ▶</button>
    <button id="nextS" type="button" title="下一幕">下一幕 ⏭</button>
    <label for="voice"><input type="checkbox" id="voice" checked> 語音旁白</label>
    <label for="rate">語速
      <select id="rate"><option value="0.85">慢</option><option value="1" selected>正常</option><option value="1.2">快</option></select>
    </label>
    <button id="fs" type="button">全螢幕</button>
    <span class="pos" id="pos">1 / 1</span>
  </div>

    <div class="piece" data-s="2" style="--pc:var(--ai)"><span class="pn">1 · ACTION</span><b>做什麼？</b><p>把報價單整理成一張總表</p></div>
    <div class="piece" data-s="3" style="--pc:var(--violet)"><span class="pn">2 · SOURCE</span><b>用哪些資料？</b><p>這個資料夾裡的 12 份報價單</p></div>
    <div class="piece" data-s="4" style="--pc:var(--warn)"><span class="pn">3 · FORMAT</span><b>做成什麼樣子？</b><p>欄位：客戶、品項、金額、日期；金額含稅、由大排到小</p></div>
    <div class="piece" data-s="5" style="--pc:var(--del)"><span class="pn">4 · SAFETY</span><b>什麼不能動？</b><p>存成新檔案，不要改到原本的 12 份報價單</p></div>
  </div>
  <div class="assembled" data-s="6">
    <u style="--pc:var(--ai)">把</u><u style="--pc:var(--violet)">這個資料夾裡的 12 份報價單</u><u style="--pc:var(--ai)">整理成一張總表</u>，<u style="--pc:var(--warn)">欄位要有客戶、品項、金額、日期，金額含稅並由大排到小</u>；<u style="--pc:var(--del)">存成新檔案，不要改到原本的 12 份報價單</u>。
  </div>
</div>`,
steps:[
  {say:'很多人開頭只打一句「幫我整理報價單」。'},
  {say:'這句話太短，AI 只好猜：什麼格式？哪些欄位？存在哪？到處翻找，反而浪費時間和額度。'},
  {say:'好的提示詞有四個零件。第一，做什麼：把報價單整理成一張總表。'},
  {say:'第二，用哪些資料：這個資料夾裡的 12 份報價單。'},
  {say:'第三，做成什麼樣子：欄位要有客戶、品項、金額、日期，金額含稅並由大排到小。'},
  {say:'第四，什麼不能動：存成新檔案，不要改到原本的報價單。'},
  {say:'四個零件組起來，就是一句它完全不用猜的指令。'}
]},

/* 10 計劃模式 */
{ch:2, title:'計劃模式完整演練', html:`
<div class="plan">
  <ol>
    <li data-s="1" data-h="1"><b>A</b><div>切到「計劃」模式<small>送出四零件提詞，它只能看不能改</small></div></li>
    <li data-s="2" data-h="2"><b>B</b><div>AI 主動提問與推薦<small>掃描後列出疑問，最佳選項貼 [推薦]</small></div></li>
    <li data-s="3" data-h="3"><b>C</b><div>審閱計劃與修訂<small>哪一步不滿意就按「修訂」</small></div></li>
    <li data-s="4" data-h="4"><b>D</b><div>按「接受」才動手<small>第一次別選「接受並啟用自動模式」</small></div></li>
  </ol>
  <div class="win" data-s="0">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="pane" data-c="0,1"><div style="flex:1;color:#7a7466">把這個資料夾裡的 12 份報價單整理成一張總表⋯</div><div style="display:flex;gap:10px;align-items:center"><span style="color:#7a7466">權限：</span><span class="pill" data-c="0">手動</span><span class="pill big" data-c="1" style="margin-left:-80px">計劃</span></div></div>
    <div class="pane" data-c="2"><b>我看完 12 份檔案了，有一個問題：</b><div>金額要用含稅還是未稅？</div><div class="opt rec">含稅（每份 × 1.05）<span class="badge">推薦</span></div><div class="opt">未稅（保留原數字）</div></div>
    <div class="pane" data-c="3"><b>Claude 提出了一項計劃</b><div>1. 讀取 12 份報價單<br>2. 統一日期為西元年、金額轉含稅<br>3. 依金額由大到小排序<br>4. 另存「報價單總表_2026.csv」</div><div class="btns"><span class="btn glow">修訂</span><span class="btn pri">接受</span></div></div>
    <div class="pane" data-c="4"><b>Claude 提出了一項計劃</b><div>1. 讀取 12 份報價單<br>2. 統一日期為西元年、金額轉含稅<br>3. 依金額由大到小排序<br>4. 另存「報價單總表_2026.csv」</div><div class="strike">接受並啟用自動模式（新手先別按）</div><div class="btns"><span class="btn">修訂</span><span class="btn pri glow">接受</span></div></div>
  </div>
</div>`,
steps:[
  {say:'接下來，用計劃模式完整走一遍。'},
  {say:'A：把輸入框下方的權限切到「計劃」，再送出四零件提詞。它只能看、不能改，安心讓它調查。'},
  {say:'B：它掃描完會主動提問，例如「金額含稅還是未稅？」，並在最佳選項旁貼上推薦標籤。'},
  {say:'C：接著跳出「Claude 提出了一項計劃」。哪一步不滿意就按修訂，這時改方向最省事。'},
  {say:'D：計劃完全正確，才按「接受」。新手第一次不要按「接受並啟用自動模式」，一步步確認最穩。'}
]},

/* 11 辦公桌記憶 */
{ch:3, title:'為什麼開新對話它就忘了？', html:`
<div class="deskbox">
  <div class="desk-note" data-s="0">辦公桌 = AI 的工作記憶</div>
  <div class="newchat" data-s="1">＋ 新對話</div>
  <div class="tabletop"></div>
  ${[['你：金額要含稅',300,370,-8],['讀過的 12 份報價單',440,350,6],['你：日期用西元年',580,380,-4],['昨天做的總表',720,345,9],['你：檔名加日期',860,372,-6]].map((p,i)=>`<div class="paper" data-s="0" data-x="1" style="left:${p[1]}px;top:${p[2]-150}px;transform:rotate(${p[3]}deg);--d:${i*.15}s">${p[0]}</div>`).join('')}
  <div class="handbook" data-s="2" data-a="3"><b>CLAUDE.md</b><span>新人報到手冊</span></div>
</div>`,
steps:[
  {say:'第三集。你跟 AI 講的話、它讀過的檔案、做事的歷程，全部堆在它面前這張辦公桌上。'},
  {say:'但是每開一個新對話，它拿到的就是一張全新、空無一物的桌子。昨天交代的規矩，完全不在上面。'},
  {say:'解決方法是：在資料夾根目錄放一份說明書，叫做 CLAUDE 點 MD，就像新人報到手冊。'},
  {say:'每次開新對話，Claude Code 第一件事就是把這份手冊整份讀一遍，自動繼承所有規矩，從此不再失憶。'}
]},

/* 12 寫進說明書 */
{ch:3, title:'黃金絕招：犯同一個錯，一句話存進說明書', html:`
<div class="two">
  <div class="chat">
    <div class="bubble ai" data-s="0"><span class="who">CLAUDE</span>總表做好了：報價單總表.csv</div>
    <div class="bubble me" data-s="1"><span class="who">你</span>做好的檔案前面一律加今天日期，把這條寫進說明書。</div>
    <div class="bubble ai" data-s="2"><span class="who">CLAUDE</span>好的，已在 CLAUDE.md 補上這條規則，並把檔名改成 20261107_報價單總表.csv。</div>
  </div>
  <div class="doc" data-s="0">
    <div class="fn">CLAUDE.md</div>
    <div class="h"># 角色身分</div>
    <div>- 業務助理，使用繁體中文（台灣）</div>
    <div class="h"># 核心規則</div>
    <div>- 金額一律以「含稅」計算</div>
    <div>- 日期統一為西元年 YYYY/MM/DD</div>
    <div class="add" data-s="2" style="--d:.6s">+ 做好的檔案，檔名前一律加今天日期</div>
    <div class="h"># 安全防線</div>
    <div>- 原始檔案禁止覆蓋或刪除</div>
  </div>
</div>`,
steps:[
  {say:'發現它產出總表，又忘了加日期？'},
  {say:'不要只是生氣叫它改，多加一句：「做好的檔案前面一律加今天日期，把這條寫進說明書。」'},
  {say:'它就會自己打開 CLAUDE.md，補上這條規則。'},
  {say:'下次開新對話，它再也不會犯同一個錯。'}
]},

/* 13 辦公桌管理 */
{ch:3, title:'辦公桌管理術：對話太長怎麼辦？', html:`
<div class="meterbox">
  <div class="meter-row" data-s="0">
    <span class="lab">辦公桌使用量</span>
    <div class="meter"><div class="fill"></div><div class="mark"></div></div>
    <span class="mnum stack"><span data-c="0">35%</span><span data-c="1">74%</span><span data-c="2">28%</span><span data-c="3,4">4%</span></span>
  </div>
  <div class="acts">
    <div class="act-row" data-s="2"><span class="k">同一個任務要繼續做</span><span class="do">輸入 /compact</span><span class="why">把冗長對話濃縮成重點，騰出空間、保留進度</span></div>
    <div class="act-row" data-s="3"><span class="k">要換一項全新任務</span><span class="do">按左上角「新增」</span><span class="why">拿到乾淨的桌子，CLAUDE.md 自動重新載入</span></div>
    <div class="act-row" data-s="4"><span class="k">工作告一段落要收工</span><span class="do">「幫我把今天的重點存起來」</span><span class="why">值得記住的規則存進說明書或記憶筆記</span></div>
  </div>
</div>`,
steps:[
  {say:'對話越來越長，辦公桌也越堆越滿。', vars:{'--m':'35%','--mc':'var(--ai)'}},
  {say:'同一個任務要繼續做，但桌子已經用掉超過 70%，它就會開始忘東忘西。', vars:{'--m':'74%','--mc':'var(--del)'}},
  {say:'這時輸入斜線 compact，它會把前面的對話濃縮成精華重點，騰出空間，同時保留進度。', vars:{'--m':'28%','--mc':'var(--ai)'}},
  {say:'如果要換一項全新任務，就按左上角「新增」開新對話。桌子變乾淨，CLAUDE.md 也會自動重新載入。', vars:{'--m':'4%','--mc':'var(--ai)'}},
  {say:'工作告一段落要收工時，跟它說「幫我把今天的重點存起來」，下次就能無縫接軌。'}
]},

/* 14 說明書 vs 記憶 */
{ch:3, title:'說明書和記憶筆記本', html:`
<div class="vs2">
  <div class="card" data-s="1" style="border-color:var(--ai)">
    <h3 class="hlA">說明書<small>CLAUDE.md</small></h3>
    <p>你明訂的最高指導原則。每次開新對話，整份一字不漏讀過。</p>
    <ul><li>強制欄位格式</li><li>含稅規則</li><li>哪些檔案不能動</li></ul>
  </div>
  <div class="card" data-s="2" style="border-color:var(--violet)">
    <h3 class="hlV">記憶筆記本<small>MEMORY</small></h3>
    <p>AI 自己的工作隨手筆記，根據互動自主記錄你的小習慣。</p>
    <ul><li>你偏好的說話方式</li><li>常用的檔名寫法</li><li>上次做到哪裡</li></ul>
  </div>
</div>
<div class="tips">
  <div class="bubble me" data-s="3"><span class="who">查詢</span>你記了我哪些事？</div>
  <div class="bubble me" data-s="3" style="--d:.4s"><span class="who">整理</span>幫我整理記憶，重複的合併，過時的刪掉。</div>
</div>`,
steps:[
  {say:'AI 的長期記憶有兩種。'},
  {say:'說明書，是你明訂的最高指導原則，每次開新對話都會一字不漏讀過。適合放硬性規範。'},
  {say:'記憶筆記本，是 AI 自己的隨手筆記，會根據互動記下你的小習慣。'},
  {say:'想知道它記了什麼，就問「你記了我哪些事？」；要整理，就說「重複的合併，過時的刪掉」。'}
]},

/* 15 先看一遍 */
{ch:4, title:'為什麼叫 AI 做事會改來改去？', html:`
<div class="badloop" data-s="0" data-x="1">
  <div class="spin"></div>
  <span class="bl" style="left:150px;top:20px">直接叫它做</span>
  <span class="bl" style="left:300px;top:130px">方向做歪</span>
  <span class="bl" style="left:150px;top:240px">叫它改</span>
  <span class="bl" style="left:0;top:130px">補丁越改越亂</span>
</div>
<div class="look">
  <p class="lead" data-s="0">開口就叫它直接做，是翻車的開始。</p>
  <div class="bubble me" data-s="1"><span class="who">你 · 第 1 步：先看</span>看一眼這 12 份報價單，跟我說哪幾份格式不一樣，<mark>先不要改任何檔案</mark>。</div>
  <div class="bubble ai" data-s="2"><span class="who">CLAUDE</span>有 2 份日期寫法不同：「113/05/20」是民國年、「05/15/2024」是月日年。要統一成 2024/05/20 這種寫法嗎？</div>
  <div class="choice" data-s="3"><span class="opt2 rec">統一成西元年 <span class="badge">推薦</span></span><span class="opt2">保持原樣</span><span class="hlW" style="font-size:22px;font-weight:700">決定權在你</span></div>
</div>`,
steps:[
  {say:'第四集。為什麼很多人叫 AI 做事，會改來改去？因為開口就叫它直接做。它沒看清格式就動手，做歪了再補丁，越改越亂。'},
  {say:'第一步，先看。加上魔法咒語：「先不要改任何檔案」。'},
  {say:'它會先檢查，回報例如：有兩份日期寫法不同，一份民國年，一份月日年。'},
  {say:'然後主動問你要不要統一。這時候，決定權完全在你。'}
]},

/* 16 Diff */
{ch:4, title:'做完再檢查：看懂紅綠 Diff', html:`
<div class="diffwrap">
  <div class="diff" data-s="0">
    <div class="fh"><span class="tri" data-a="1">▶</span> 已編輯　報價單總表_2026.csv</div>
    <div class="ln" data-s="1"><span class="no">1</span><span class="sg"> </span>客戶名稱,品項規格,含稅金額,報價日期</div>
    <div class="ln del" data-s="1" style="--d:.2s" data-h="2"><span class="no">2</span><span class="sg">-</span>立德印刷,商業海報印刷,<b>未稅: 4500</b>,<b>113/05/20</b></div>
    <div class="ln add hl" data-s="1" style="--d:.4s"><span class="no">2</span><span class="sg">+</span>立德印刷,商業海報印刷,<b>4725</b>,<b>2024/05/20</b></div>
    <div class="ln" data-s="1" style="--d:.6s"><span class="no">3</span><span class="sg"> </span>宏達科技,伺服器年度維護,18900,2024/05/18</div>
    <div class="ln del" data-s="1" style="--d:.8s"><span class="no">4</span><span class="sg">-</span>富邦食品,包裝耗材一批,<b>8500</b>,<b>05/15/2024</b></div>
    <div class="ln add" data-s="1" style="--d:1s"><span class="no">4</span><span class="sg">+</span>富邦食品,包裝耗材一批,<b>8925</b>,<b>2024/05/15</b></div>
  </div>
  <div class="flags">
    <div class="legend" data-s="1"><span style="--c:var(--add)">綠色＝新增</span><span style="--c:var(--del)">紅色＝被拿掉</span></div>
    <h3 data-s="3">三大必看紅旗</h3>
    <div class="flag" data-s="3"><b>1</b><div>你沒叫它改的檔案被動到了<br><span class="mut" style="font-size:17px">只叫它做總表，卻改了原本的報價單</span></div></div>
    <div class="flag" data-s="4"><b>2</b><div>大片紅色<br><span class="mut" style="font-size:17px">代表大量內容被拿掉或誤刪</span></div></div>
    <div class="flag" data-s="5"><b>3</b><div>寫進檔案的敏感資訊<br><span class="mut" style="font-size:17px">明文密碼、Token、機密網址</span></div></div>
  </div>
</div>`,
steps:[
  {say:'做完別急著用！點開對話中「已編輯」旁邊的三角形。'},
  {say:'綠色是新增的，紅色是被拿掉的，一眼就看清它動了哪幾行。'},
  {say:'例如：立德印刷從未稅 4500 改成含稅 4725，日期也從民國年統一成西元年。'},
  {say:'檢查時要特別注意三大紅旗。第一，你沒叫它改的檔案，卻被動到了。'},
  {say:'第二，大片紅色，代表有大量內容被拿掉或誤刪。'},
  {say:'第三，檔案裡出現明文密碼、Token 這類敏感資訊。'}
]},

/* 17 ESC 倒回 */
{ch:4, title:'時光機：ESC 倒回（Rewind）', html:`
<div class="rw">
  <div class="rw-chat">
    <div class="msg" data-s="0"><b>對話 1</b>看一眼 12 份報價單，先不要改</div>
    <div class="msg" data-s="0" style="--d:.2s"><b>對話 2</b>產出 12 份報價單的初始總表<span class="st hlG">✓ 完美</span></div>
    <div class="msg bad" data-s="0" data-x="3" style="--d:.4s"><b>對話 3</b>依客戶名稱重新排序<span class="st hlD">✕ 做錯</span></div>
    <div class="input2"><span class="ph" data-c="0,1,2">輸入訊息⋯</span><span data-s="3" style="position:absolute;margin-left:0">依客戶名稱重新排序<span class="mut">（可改個講法再送出）</span></span></div>
  </div>
  <div class="rw-r">
    <div class="keycap" data-s="1" data-a="1">ESC</div>
    <div class="modal" data-s="1" data-x="3" style="--d:.5s">
      <h4>選擇你想倒回到哪一句話之前？</h4>
      <div class="o" data-h="2">[對話 3] 依客戶名稱重新排序（做錯了）</div>
      <div class="o">[對話 2] 產出 12 份報價單的初始總表</div>
      <div class="mut" style="font-size:16px">還原模式：程式碼與對話一起回到過去</div>
    </div>
    <div class="clock" data-s="2" data-a="2"><i></i>時光倒流中⋯</div>
    <div class="ok-banner" data-s="3">時光倒流成功！檔案瞬間變回原樣，出錯的那句話也自動放回輸入框。</div>
  </div>
</div>`,
steps:[
  {say:'AI 整批做錯、方向偏掉時，不要在對話裡一直叫它改回來，那只會越改越亂。'},
  {say:'在輸入框空白時，直接按鍵盤左上角的 ESC 鍵，叫出倒回視窗。'},
  {say:'選擇要倒回到哪一句話之前，程式碼和對話會一起回到過去。'},
  {say:'成功！檔案瞬間變回原樣，剛才出錯的那句話也自動放回輸入框，改個講法就能重新送出。比一直叫它改回來快十倍。'}
]},

/* 18 派幫手 */
{ch:4, title:'翻大量檔案？派幫手去「隔壁桌」', html:`
<div class="sub">
  <div class="dk main" data-s="0">

/* ---------- 引擎 ---------- */
const $ = id => document.getElementById(id);
const stage = $('stage'), screen = $('screen'), subtitle = $('subtitle');
let si = 0, st = 0, playing = false, cur = null, timer = null, tok = 0;
let voiceOn = true, rate = 1;

function fit(){
  const s = screen.clientWidth / 1280;
  stage.style.transform = `scale(${s})`;
}
new ResizeObserver(fit).observe(screen);
fit();

function buildScene(i){
  const sc = SC[i];
  const el = document.createElement('div');
  el.className = 'sc';
  el.innerHTML = (sc.bare ? '' : `<div class="hd"><span class="tag">${CH[sc.ch].id}</span><h2>${sc.title}</h2></div>`) +
    (sc.bare ? sc.html : `<div class="bd">${sc.html}</div>`);
  return el;
}
const inList = (v, n) => String(v).split(',').map(Number).includes(n);

function applyStep(){
  const root = cur;
  root.querySelectorAll('[data-s]').forEach(e => e.classList.toggle('on', st >= +e.dataset.s));
  root.querySelectorAll('[data-x]').forEach(e => e.classList.toggle('gone', st >= +e.dataset.x));
  root.querySelectorAll('[data-a]').forEach(e => e.classList.toggle('act', st >= +e.dataset.a));
  root.querySelectorAll('[data-c]').forEach(e => e.classList.toggle('cur', inList(e.dataset.c, st)));
  root.querySelectorAll('[data-h]').forEach(e => e.classList.toggle('hl', inList(e.dataset.h, st)));
  const vars = {};
  SC[si].steps.slice(0, st + 1).forEach(s => Object.assign(vars, s.vars || {}));
  Object.entries(vars).forEach(([k, v]) => root.style.setProperty(k, v));
  subtitle.textContent = SC[si].steps[st].say;
  updateUI();
}

function show(i, s){
  const changed = i !== si || !cur;
  si = i; st = s;
  if (changed){
    const old = cur;
    cur = buildScene(i);
    stage.appendChild(cur);
    if (old){ old.classList.remove('show'); setTimeout(() => old.remove(), 550); }
    // 先套用前一狀態再切換，讓進場有動畫
    void cur.offsetWidth;
    requestAnimationFrame(() => { cur.classList.add('show'); applyStep(); });
  } else {
    applyStep();
  }
}

/* 語音 */
let zhVoice = null;
function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  zhVoice = vs.find(v => /zh[-_]TW/i.test(v.lang)) || vs.find(v => /zh[-_](HK|Hant)/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
else { $('voice').checked = false; $('voice').disabled = true; voiceOn = false; }

function stopSpeech(){ try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch(e){} }
function clean(t){ return t.replace(/CLAUDE 點 MD|CLAUDE\.md/g, 'Claude 點 MD').replace(/[「」『』]/g, ''); }

function runStep(){
  clearTimeout(timer);
  const my = ++tok;
  if (!playing) return;
  const text = SC[si].steps[st].say;
  const est = (1400 + text.length * 210) / rate;
  const t0 = Date.now();
  let done = false;
  const fin = () => {
    if (done || my !== tok) return;
    done = true;
    const wait = Math.max(0, 2400 - (Date.now() - t0));
    timer = setTimeout(() => { if (my === tok) advance(); }, wait + 450);
  };
  if (voiceOn){
    stopSpeech();
    const u = new SpeechSynthesisUtterance(clean(text));
    u.lang = 'zh-TW'; if (zhVoice) u.voice = zhVoice; u.rate = rate;
    u.onend = fin; u.onerror = () => { timer = setTimeout(fin, est); };
    setTimeout(() => { if (my === tok) speechSynthesis.speak(u); }, 60);
    timer = setTimeout(fin, est * 2.2 + 4000); // 保險：語音沒回應也會前進
  } else {
    timer = setTimeout(fin, est);
  }
}

function advance(){
  if (st < SC[si].steps.length - 1) show(si, st + 1);
  else if (si < SC.length - 1) show(si + 1, 0);
  else { setPlaying(false); return; }
  runStep();
}

function go(i, s){ stopSpeech(); show(i, s); runStep(); }
function nextStep(){ if (st < SC[si].steps.length - 1) go(si, st + 1); else if (si < SC.length - 1) go(si + 1, 0); }
function prevStep(){ if (st > 0) go(si, st - 1); else if (si > 0) go(si - 1, SC[si - 1].steps.length - 1); }

function setPlaying(p){
  playing = p;
  $('play').textContent = p ? '❚❚ 暫停' : '▶ 播放';
  if (!p){ tok++; clearTimeout(timer); stopSpeech(); }
}
function togglePlay(){
  $('cover').hidden = true;
  if (playing){ setPlaying(false); return; }
  if (si === SC.length - 1 && st === SC[si].steps.length - 1) show(0, 0);
  setPlaying(true); runStep();
}

/* 進度、章節 */
const prog = $('prog'), chaps = $('chaps');
SC.forEach((sc, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.title = `${CH[sc.ch].id}｜${sc.title}`; b.setAttribute('aria-label', b.title);
  b.innerHTML = '<i></i>';
  b.addEventListener('click', () => { $('cover').hidden = true; go(i, 0); });
  prog.appendChild(b);
});
CH.forEach((c, ci) => {
  const first = SC.findIndex(s => s.ch === ci);
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.ch = ci;
  b.innerHTML = `<b>${c.id}</b>${c.name}`;
  b.addEventListener('click', () => { $('cover').hidden = true; go(first, 0); });
  chaps.appendChild(b);
});
function updateUI(){
  [...prog.children].forEach((b, i) => {
    const p = i < si ? 100 : i > si ? 0 : ((st + 1) / SC[si].steps.length) * 100;
    b.firstChild.style.setProperty('--p', p + '%');
  });
  [...chaps.children].forEach(b => b.classList.toggle('cur', +b.dataset.ch === SC[si].ch));
  $('pos').textContent = `第 ${si + 1} / ${SC.length} 幕 · ${st + 1}/${SC[si].steps.length}`;
}

/* 控制 */
$('cover').addEventListener('click', () => { show(0, 0); setPlaying(false); togglePlay(); });
$('play').addEventListener('click', togglePlay);
$('next').addEventListener('click', () => { $('cover').hidden = true; nextStep(); });
$('prev').addEventListener('click', () => { $('cover').hidden = true; prevStep(); });
$('nextS').addEventListener('click', () => { $('cover').hidden = true; if (si < SC.length - 1) go(si + 1, 0); });
$('prevS').addEventListener('click', () => { $('cover').hidden = true; go(st > 0 ? si : Math.max(0, si - 1), 0); });
$('voice').addEventListener('change', e => { voiceOn = e.target.checked; if (!voiceOn) stopSpeech(); if (playing) runStep(); });
$('rate').addEventListener('change', e => { rate = +e.target.value; if (playing) runStep(); });
$('fs').addEventListener('click', () => {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (screen.requestFullscreen) screen.requestFullscreen().catch(() => {});
  } catch(e){}
});
document.addEventListener('fullscreenchange', () => setTimeout(fit, 50));
document.addEventListener('keydown', e => {
  if (e.target.closest('select,input')) return;
  if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight'){ $('cover').hidden = true; nextStep(); }
  else if (e.key === 'ArrowLeft'){ $('cover').hidden = true; prevStep(); }
});

/* 初始畫面：片頭完整呈現 */
show(0, SC[0].steps.length - 1);
})();
</script>
</body>
